name: Rename site file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with rebuilt site
        run: |
          git config user.name "mekostock"
          git config user.email "mekostock@users.noreply.github.com"
          git rm -q index.html
          git mv luxeempirediginal.html index.html
          git commit -m "Replace index.html with rebuilt Luxe Empire Digital site"
          git push
